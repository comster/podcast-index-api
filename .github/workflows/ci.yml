name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            # Offline unit tests run here; the live integration tests self-skip
            # unless PODCASTINDEX_API_KEY / PODCASTINDEX_API_SECRET are provided.
            - run: npm test
              env:
                  PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
                  PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
